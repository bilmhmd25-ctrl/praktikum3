<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: arial, helvetica, sans-serif;
        }


        html, body {
         width: 100%;
         height: 100%;
         background-color:rgb(0, 247, 255); 
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 10px;
        }

        header {
            background-color:rgb(0, 255, 255);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;  
            font-weight: bold;
            border: 1px solid;
         }

         nav {
            background-color: #66ff00;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid;
         }

         .main-content {
            display: flex;
            gap: 10px;
            flex: 1;
         }

         article {
            flex: 3;
            background-color: #ffaa82;
            padding: 15px;
            border: 1px solid #ffe082;
            display: flex;
            flex-direction: column;
            gap: 10px;
         }

         section {
            background-color: #ffa857;
            padding: 15px;
            border: 1px solid #ff9b28;
            display: flex;
            align-items: center;
         }

         aside {
            flex: 1;
            background-color: #08fdc8;
            padding: 15px;
            border: 1px solid #00c11a;
         }

         footer {
            background-color: #ffca28;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid;
         }
    </style>
</head>
<body>
   <div class="wrapper">
       <header>
           <img src="gambar.jpg" alt="ini gambarku" width="150px">
           <p>ini website ku</p>
       </header>

       <nav>
         nav
       </nav>
       
       <div class="main-content">
           <article>
             article
             <section>sec</section>
             <section>sec</section>
             <section>sec</section>
           </article>

           <aside>
              aside
           </aside>
       </div>

       <footer>
           footer
       </footer>
   </div> 
</body>
</html>
